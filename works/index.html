<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Works | 불방 인터랙티브</title>
<meta name="description" content="불방 인터랙티브 작업 모음" />
<!-- 고객 전달용 단독 페이지. 메인(index.html)에서는 링크하지 않고 주소(/works/)로만 공유한다 -->
<meta name="robots" content="noindex" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="불방 인터랙티브" />
<meta property="og:title" content="Works | 불방 인터랙티브" />
<meta property="og:description" content="불방 인터랙티브 작업 모음" />
<meta property="og:url" content="https://www.boolbang.com/works/" />
<meta property="og:image" content="https://www.boolbang.com/images/logo_card.webp" />
<link rel="icon" href="/images/boolpavi_64.png" type="image/png" />
<link rel="apple-touch-icon" href="/images/boolpavi_180.png" />
<!-- 글꼴은 사이트 공통 D2Coding만 사용 (외부 폰트 금지) -->
<link rel="stylesheet" href="/css/fonts.css" />
<style>
/* 레이아웃: 위 메뉴(이름·분류·Contact) → 작업 목차(번호·제목·분류·VID/IMG) → 작업별 섹션(첫 장은 2칸, 나머지 1칸, 4열) → 아래 연락처.
   색은 제안서(/proposal/)와 같은 빨강 바탕 + 먹색 글자 — 제안서와 함께 보내는 한 벌로 보이게. 글꼴은 D2Coding 하나 */
:root{
  --bg:#ef4444;
  --ink:#140808;
  --mute:#3a1212;
  --line:rgba(20,8,8,.3);
  --tile:rgba(20,8,8,.12);
  --pad:24px;
  --gap:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"D2Coding",monospace;font-size:14px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:hover,button:hover{text-decoration:underline;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{padding-left:var(--pad);padding-right:var(--pad)}

/* ── 위 메뉴 ── */
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:20px;border-bottom:1px solid var(--line)}
.top .name{font-weight:700}
.filters{display:flex;gap:18px}
.filters button.on{text-decoration:none}
.filters button.on::before{content:"["}
.filters button.on::after{content:"]"}
.top .contact{justify-self:end;color:var(--mute)}

/* ── 목차 ── */
.index{padding-block:24px 0}
.index-head{display:flex;justify-content:space-between;color:var(--mute);padding-bottom:6px;border-bottom:2px solid var(--ink)}
.index ol{list-style:none;margin:0;padding:0}
.index li a{display:grid;grid-template-columns:56px 1fr 120px 48px;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.index li a:hover{text-decoration:none;background:rgba(20,8,8,.08)}
.index .no,.index .cat{color:var(--mute)}
.index .kind{text-align:right;color:var(--mute)}

/* ── 작업 섹션 ── */
.works{display:flex;flex-direction:column;gap:96px;padding-block:72px 120px}
.work{scroll-margin-top:80px}
.work-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.work-head .t{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.work-head .no{color:var(--mute)}
.work-head b{font-weight:700}
.work-head .cat{color:var(--mute)}
.work-head .up{color:var(--mute)}
/* 4열 바둑판: 모든 칸 정사각형으로 잘라 줄을 맞춘다(원본 비율은 클릭해서 크게 보기에서).
   첫 장(.big)은 가로 2칸 × 세로 2줄 큰 정사각형. 섹션에 영상 한 편뿐이면 16:9 한 덩어리 */
.media{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.m{position:relative;background:var(--tile);overflow:hidden;aspect-ratio:1/1}
/* 큰 칸도 스스로 정사각형 — 폭(2칸+간격)과 높이(2줄+간격)가 같아 옆 작은 칸 두 줄과 딱 맞는다.
   옆에 작은 칸이 없는 휴대폰(2열)에서도 높이가 무너지지 않는다 */
.m.big{grid-column:span 2;grid-row:span 2}
.m.big:only-child{grid-row:auto;aspect-ratio:16/9}
/* 사진은 칸 위에 띄워 채운다 — 원본 크기가 줄 높이 계산에 끼어들면 세로로 긴 그림이 큰 칸을 늘려 옆 칸과 어긋난다 */
.m img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.m img.wait{opacity:0}
.m.img{cursor:zoom-in}
.m.vid{cursor:pointer}
/* 영상 칸 가운데 재생 버튼 — 먹색 원 + 빨강 삼각형. 마우스를 올리면 살짝 커진다 */
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(20,8,8,.82);transition:transform .2s,background .2s;pointer-events:none}
.play::after{content:"";position:absolute;left:50%;top:50%;margin:-12px 0 0 -7px;border-left:22px solid var(--bg);border-top:12px solid transparent;border-bottom:12px solid transparent}
.m.vid:hover .play,.m.vid:focus-visible .play{transform:scale(1.12);background:var(--ink)}
.m.vid:not(.big) .play{width:48px;height:48px;margin:-24px 0 0 -24px}
.m.vid:not(.big) .play::after{margin:-9px 0 0 -5px;border-left-width:16px;border-top-width:9px;border-bottom-width:9px}
.badge{position:absolute;left:8px;bottom:8px;padding:1px 6px;background:var(--ink);color:var(--bg);font-size:11.5px;letter-spacing:.04em}
.work.hide,.index li.hide{display:none}

/* ── 아래 ── */
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;padding-block:18px;border-top:2px solid var(--ink)}
.foot a:first-child{text-decoration:underline;text-underline-offset:3px}
.foot .totop{justify-self:end;color:var(--mute)}

/* ── 사진 크게 보기 ── */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:56px var(--pad) var(--pad);cursor:zoom-out}
.viewer.open{display:flex}
#vStage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
/* 영상: 16:9 틀을 화면 폭·높이 중 작은 쪽에 맞춘다 */
.viewer .vframe{position:relative;width:min(100%,calc((100vh - 80px) * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;cursor:default}
.viewer .vframe iframe{position:absolute;top:0;left:-1px;width:calc(100% + 2px);height:100%;border:0}
.viewer .x{position:absolute;top:18px;right:var(--pad);color:var(--mute)}
body.lock{overflow:hidden}

/* ── 휴대폰 ── */
@media (max-width:760px){
  :root{--pad:16px;--gap:8px}
  .top{grid-template-columns:1fr auto;row-gap:10px;padding-block:14px}
  .filters{grid-column:1/-1;grid-row:2;gap:14px;flex-wrap:wrap}
  .index li a{grid-template-columns:36px 1fr 40px}
  .index .cat{display:none}
  .works{gap:64px;padding-block:48px 80px}
  .media{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m.big{grid-row:auto}
}
</style>
</head>
<body id="top">

<header class="top wrap">
  <a class="name" href="#top">불방인터랙티브</a>
  <nav class="filters" id="filters" aria-label="분류"></nav>
  <a class="contact" href="#contact">Contact</a>
</header>

<section class="index wrap" aria-label="작업 목차">
  <div class="index-head"><span>Anything</span><span id="count"></span></div>
  <ol id="index"></ol>
</section>

<main class="works wrap" id="works"></main>

<footer class="foot wrap" id="contact">
  <a href="mailto:fromboolbang@gmail.com">fromboolbang@gmail.com</a>
  <a href="tel:027434110">02-743-4110</a>
  <a class="totop" href="#top">Top ↑</a>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="크게 보기">
  <button class="x" aria-label="닫기">Close ✕</button>
  <div id="vStage"></div>
</div>

<script>
/* ============================================================
   작업 목록 — 여기만 고치면 목차·섹션·분류가 모두 따라간다. (최대 20개 예정)
   { title, cat(분류), desc(한 줄 설명), media:[ … ] }
   · 사진: { img: "/images/…" }
   · 영상: { v: "<Stream 영상 ID>", t: 썸네일 초 } — 누르기 전엔 썸네일만, 누르면 크게 보기 창에서 재생
     직접 만든 썸네일을 쓰려면 thumb 추가: { v: "…", thumb: "/images/works/interview.webp" } (16:9 권장)
   · 3D 모델: { model: "<Sketchfab 모델 ID>", thumb: "썸네일 주소" } — 누르면 크게 보기 창에서 돌려볼 수 있다
   media의 첫 번째가 큰 칸(2칸)이 된다.
   ============================================================ */
const WORKS = [
  {
    title: "Space",
    cat: "Video",
    desc: "Showreel",
    media: [
      { v: "f083e16ffaa8811ad2857ce527cf9576", t: 0 },
    ],
  },
  {
    title: "Interview",
    cat: "Video",
    desc: "Interview film",
    media: [
      { v: "5b2c486a3cf6b5d9111cd676713e8101", t: 55 },
    ],
  },
  {
    title: "3D, VFX",
    cat: "3D",
    desc: "Modeling · Process",
    media: [
      // Sketchfab 3D 모델 (포트폴리오 3D, VFX 탭과 같은 모델). 썸네일은 Sketchfab oEmbed가 주는 대표 이미지
      { model: "21e9a8ac1bb4452ca6b3d8f1766219c1", thumb: "https://media.sketchfab.com/models/21e9a8ac1bb4452ca6b3d8f1766219c1/thumbnails/979b245a48a24f69b860185f8d0993e5/806e99731d134281965a8e14855be985.jpeg" },
      { img: "/images/3D/workascii.webp" },
      { img: "/images/3D/motteprocess%20(2).webp" },
      { img: "/images/3D/mottefin%20(2).webp" },
      { img: "/images/3D/3dsample%20(2).webp" },
      // 3D 렌더 ↔ 실제 현장 사진 짝: 공장 라인(3d_2 ↔ 3d_6, 3d_4), 건물(3d_1, 3d_3 ↔ 3d_5)
      { img: "/images/3D/3d_2.webp" },
      { img: "/images/3D/3d_6.webp" },
      { img: "/images/3D/3d_4.webp" },
      { img: "/images/3D/3d_1.webp" },
      { img: "/images/3D/3d_3.webp" },
      { img: "/images/3D/3d_5.webp" },
      { img: "/images/3D/idea%20(5).jpg" },
      { img: "/images/3D/L_side%20copy.webp" },
    ],
  },
  {
    title: "Photos",
    cat: "Photo",
    desc: "Portrait photography",
    media: [
      { img: "/images/photos/face%20(5).webp" },
      { img: "/images/photos/photo%20(2).webp" },
      { img: "/images/photos/photo%20(7).webp" },
      { img: "/images/photos/space3_low-22%20copy.webp" },
      { img: "/images/photos/space3_low-32%20copy.webp" },
      { img: "/images/photos/conceptphoto%20(5).jpg" },
      { img: "/images/photos/face%20(2).webp" },
      { img: "/images/photos/photo%20(5).webp" },
    ],
  },
  {
    title: "Concept sketch",
    cat: "Drawing",
    desc: "Pencil on paper",
    media: [
      { img: "/images/drawing/8.webp" },
      { img: "/images/drawing/horsesign.webp" },
      { img: "/images/drawing/0.webp" },
      { img: "/images/drawing/6.webp" },
      { img: "/images/drawing/12.webp" },
      { img: "/images/drawing/19.webp" },
      { img: "/images/drawing/3.webp" },
      { img: "/images/drawing/1cam.webp" },
      { img: "/images/drawing/guide.webp" },
    ],
  },
];

const STREAM = "https://customer-axzwwxc3yts30fgc.cloudflarestream.com/";
const pad = n => String(n).padStart(2, "0");
const kind = w => (w.media.some(m => m.v) ? "VID" : "IMG");
const CATS = [...new Set(WORKS.map(w => w.cat))];

/* ── 목차 + 섹션 그리기 ── */
const index = document.getElementById("index");
const works = document.getElementById("works");
document.getElementById("count").textContent = `${pad(WORKS.length)} works`;

WORKS.forEach((w, i) => {
  const id = "w" + pad(i + 1);

  const li = document.createElement("li");
  li.innerHTML = `<a href="#${id}"><span class="no">${pad(i + 1)}</span><span>${w.title}</span><span class="cat">${w.cat}</span><span class="kind">${kind(w)}</span></a>`;
  index.appendChild(li);

  const sec = document.createElement("section");
  sec.className = "work";
  sec.id = id;
  sec.innerHTML = `<div class="work-head">
      <div class="t"><span class="no">${pad(i + 1)}</span><b>${w.title}</b><span class="cat">${w.cat} · ${w.desc}</span></div>
      <a class="up" href="#top" aria-label="맨 위로">↑</a>
    </div>
    <div class="media">${w.media.map((m, j) => {
      const big = j ? "" : " big";
      // 영상·3D 모델: 썸네일만 보여주고, 누르면 크게 보기 창에 플레이어(iframe)를 띄운다
      const embed = (src, thumb, badge, label) =>
        `<div class="m vid${big}" role="button" tabindex="0" aria-label="${w.title} ${label}" data-src="${src}">
           <img class="wait" src="${thumb}" alt="" loading="lazy" decoding="async" />
           <span class="play" aria-hidden="true"></span>
           <span class="badge">${badge}</span></div>`;
      if (m.v) return embed(`${STREAM}${m.v}/iframe?primaryColor=%23CE2B37&autoplay=true`,
        m.thumb || `${STREAM}${m.v}/thumbnails/thumbnail.jpg?time=${m.t}s&height=600`, "VIDEO", "영상 재생");
      if (m.model) return embed(`https://sketchfab.com/models/${m.model}/embed?autostart=1`, m.thumb, "3D MODEL", "3D 모델 보기");
      return `<div class="m img${big}"><img class="wait" src="${m.img}" alt="${w.title}" loading="lazy" decoding="async" /></div>`;
    }).join("")}</div>`;
  works.appendChild(sec);

  w.li = li;
  w.sec = sec;
});

// 사진이 다 받아지면 부드럽게 나타나게
document.querySelectorAll(".m img").forEach(img => {
  const show = () => img.classList.remove("wait");
  img.complete ? show() : (img.onload = img.onerror = show);
});

/* ── 분류 필터 (주소 끝 #video 처럼 분류를 붙여 공유 가능) ── */
const filters = document.getElementById("filters");
["All", ...CATS].forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  b.dataset.c = c;
  b.onclick = () => { history.replaceState(null, "", c === "All" ? location.pathname : "#" + c.toLowerCase()); setFilter(c); };
  filters.appendChild(b);
});
function setFilter(c) {
  filters.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  let n = 0;
  WORKS.forEach(w => {
    const hide = !(c === "All" || w.cat === c);
    w.li.classList.toggle("hide", hide);
    w.sec.classList.toggle("hide", hide);
    if (!hide) n++;
  });
  document.getElementById("count").textContent = `${pad(n)} works`;
}
const fromHash = () => {
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  return CATS.find(c => c.toLowerCase() === h) || "All";
};
setFilter(fromHash());
window.addEventListener("hashchange", () => { const c = fromHash(); if (c !== "All" || !location.hash) setFilter(c); });

/* ── 크게 보기: 사진은 원본 비율, 영상은 16:9 플레이어로 바로 재생 ── */
const viewer = document.getElementById("viewer");
const vStage = document.getElementById("vStage");
// 열 때 브라우저 기록에 한 칸을 넣어 두어, 휴대폰·PC의 '뒤로가기'가 페이지를 떠나지 않고 창만 닫게 한다
function openViewer(html) {
  vStage.innerHTML = html;
  if (!viewer.classList.contains("open")) history.pushState({ viewer: true }, "");
  viewer.classList.add("open");
  document.body.classList.add("lock");
}
function hideViewer() {
  viewer.classList.remove("open");
  document.body.classList.remove("lock");
  vStage.innerHTML = ""; // 플레이어를 지워 재생·요금을 멈춘다
}
// Close·배경·Esc로 닫을 때도 넣어 둔 기록을 되돌려, 다음 뒤로가기가 한 번 헛돌지 않게
function closeViewer() {
  if (history.state && history.state.viewer) history.back(); // → popstate에서 hideViewer
  else hideViewer();
}
window.addEventListener("popstate", () => { if (viewer.classList.contains("open")) hideViewer(); });
const openVideo = el => openViewer(
  `<div class="vframe"><iframe src="${el.dataset.src}"
    allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen; xr-spatial-tracking;" allowfullscreen></iframe></div>`);

works.addEventListener("click", e => {
  const v = e.target.closest(".m.vid");
  if (v) return openVideo(v);
  const p = e.target.closest(".m.img");
  if (p) openViewer(`<img src="${p.querySelector("img").src}" alt="" />`);
});
works.addEventListener("keydown", e => {
  const v = e.target.closest(".m.vid");
  if (v && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openVideo(v); }
});
// 영상 바깥(흰 배경)이나 Close를 누르면 닫힘. 영상 틀 안을 누를 땐 닫지 않는다
viewer.onclick = e => { if (!e.target.closest(".vframe")) closeViewer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer(); });
// 다른 탭으로 가면 열린 영상은 닫는다 (요금 방지)
document.addEventListener("visibilitychange", () => { if (document.hidden && vStage.querySelector("iframe")) closeViewer(); });
</script>
</body>
</html>
